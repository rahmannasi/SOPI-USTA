    <path d="M 30 8 
             L 51 25.5 
             V 50 
             C 51 52.5 49 54.5 46.5 54.5 
             H 13.5 
             C 11 54.5 9 52.5 9 50 
             V 25.5 
             Z" 
          fill="none" 
