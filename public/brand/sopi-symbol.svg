<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  
  <!-- House Outline -->
  <path d="M 50 14 
           L 84 42 
           V 81 
           C 84 85 81 88 77 88 
           H 23 
           C 19 88 16 85 16 81 
           V 42 
           Z" 
        fill="none" 
        stroke="#FFC700" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Integrated Open-End Wrench (Technical 45-degree angle) -->
  <g transform="translate(50, 56) rotate(-45)">
    <!-- Wrench Handle with grip detail -->
    <rect x="-4" y="2" width="8" height="28" rx="4" fill="#FFC700" />
    <!-- Wrench Head -->
    <path d="M -13 -4 
             C -13 -12.5 -7 -18 0 -18 
             C 7 -18 13 -12.5 13 -4 
             C 13 1.5 10 6 5.5 8.5 
             L -5.5 8.5 
             C -10 6 -13 1.5 -13 -4 Z" 
          fill="#FFC700" />
    <!-- Open Jaw Cutout -->
    <path d="M -5 -19 
             L 5 -19 
             L 5 -8 
             L 0 -4 
             L -5 -8 Z" 
          fill="#0B1426" />
    <!-- Inner Handle Cutout / Detail Hole -->
    <circle cx="0" cy="22" r="2.2" fill="#0B1426" />
  </g>
</svg>